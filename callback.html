<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorización · 0xhacky</title><link rel="stylesheet" href="estilo.css"></head><body><main>
<h1>Autorización recibida</h1>
<p id="m">Copia este código en la terminal donde se ejecuta "0xhacky publicador" y cierra esta pestaña.</p>
<pre id="c" style="white-space:pre-wrap;word-break:break-all;background:#2B3038;padding:12px;border-radius:8px"></pre>
<script>
const p=new URLSearchParams(location.search),m=document.getElementById('m'),c=document.getElementById('c');
// Si la autorización la pidió el servicio local de 0xhacky publicador (state "local-<puerto>-..."), le pasamos el código.
const local=/^local-(\d{4,5})-[a-f0-9]+$/.exec(p.get('state')||'');
if(local&&p.get('code')){
  m.textContent='Connecting to 0xhacky publicador...';c.style.display='none';
  fetch('http://127.0.0.1:'+local[1]+'/callback'+location.search).then(r=>r.json()).then(d=>{
    if(d.volver)location.replace(d.volver);else m.textContent=d.mensaje||d.error||'';
  }).catch(()=>{m.textContent='0xhacky publicador is not running on this computer.';});
}
else c.textContent=p.get('code')?p.get('code'):('Sin código: '+(p.get('error_description')||p.get('error')||''));
</script>
<p><a href="index.html">Inicio</a></p></main></body></html>
